<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Job Loss Tracker</title>
    <script>
      // GitHub Pages SPA fallback (rafgraph/spa-github-pages).
      // GitHub Pages serves this page for any path that has no static file
      // (e.g. /predictions). Encode the path into the query string and
      // redirect to index.html, where the decoder in <head> restores it
      // before React mounts. pathSegmentsToKeep = 0 (custom domain root).
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
