    <script>
      // --- SPA routing bootstrap (must run before React mounts) ---
      (function (l) {
        // 1) GitHub Pages SPA fallback decoder (rafgraph/spa-github-pages,
        //    pathSegmentsToKeep = 0 for the custom domain). public/404.html
        //    encodes a deep-link path as /?/predictions&q=... ; restore it here.
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
        // 2) Legacy hash-URL shim: old links/embeds use HashRouter URLs
        //    (/#/predictions, /#/embed/dashboard, /#/widget/stats). Rewrite
        //    them to real paths so BrowserRouter picks them up.
        if (l.hash && l.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, null, l.hash.slice(1));
        }
      })(window.location);
    </script>
