# Workflow A: Research to Staging (automation/research.py)
#
# Currently manual-only (workflow_dispatch). The every-2-days schedule
# below is intentionally COMMENTED OUT - it gets enabled at build-order
# step 3, after 2-3 audited manual runs (see automation/README.md).
name: Research to Staging

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Recency window in days (7 normal, 30 catch-up)"
        required: false
        default: "7"
      dry_run:
        description: "Dry run (no Sheets writes, no email)"
        type: boolean
        required: false
        default: false
  # Enable at build-order step 3 (every 2 days, 06:00 America/Chicago = 11:00 UTC):
  # schedule:
  #   - cron: "0 11 */2 * *"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_STAGING_ID: ${{ secrets.SHEET_STAGING_ID }}
          SHEET_TRACKER_ID: ${{ secrets.SHEET_TRACKER_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          WINDOW="${{ github.event.inputs.window || '7' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 automation/research.py --dry-run --window "$WINDOW"
          else
            python3 automation/research.py --window "$WINDOW"
          fi

      - name: Upload dry-run output (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-candidates
          path: automation/out/dry-run-candidates.json
          if-no-files-found: ignore
