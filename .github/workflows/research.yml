# Workflow A: Research to Staging (automation/research.py)
#
# Weekly schedule enabled 2026-09-19 (owner approval) after validation:
# dry run 35053235405 (caps held, gate correct) and live run 35468244974
# (full Sheets + digest path clean, 0 staged on a quiet week).
name: Research to Staging

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Recency window in days (7 normal, 30 catch-up)"
        required: false
        default: "7"
      dry_run:
        description: "Dry run (no Sheets writes, no email)"
        type: boolean
        required: false
        default: false
      categories:
        description: "Categories to sweep (comma-separated)"
        required: false
        default: "losses,planned,created,never"
  # Weekly, Mondays 06:00 America/Chicago (= 11:00 UTC during CDT):
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run research
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SHEET_STAGING_ID: ${{ secrets.SHEET_STAGING_ID }}
          SHEET_TRACKER_ID: ${{ secrets.SHEET_TRACKER_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          WINDOW="${{ github.event.inputs.window || '7' }}"
          CATS="${{ github.event.inputs.categories || 'losses,planned,created,never' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 automation/research.py --dry-run --window "$WINDOW" --categories "$CATS"
          else
            python3 automation/research.py --window "$WINDOW" --categories "$CATS"
          fi

      - name: Upload dry-run output (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-candidates
          path: automation/out/dry-run-candidates.json
          if-no-files-found: ignore
