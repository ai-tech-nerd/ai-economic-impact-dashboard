name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Per-route HTML copies so each main route serves HTTP 200 directly
      # (GitHub Pages resolves /predictions from predictions.html). Without
      # these, routes are served via 404.html with a 404 status, which
      # Google will not index. The 404.html fallback still covers deep
      # links like /companies/:id.
      - run: |
          for r in predictions timeline ai-advances companies learn; do
            cp dist/index.html "dist/$r.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
